  <style>
    body {

    .card {
      background: #ffffff;
      border-radius: 16px;

    .btn {
      background-color: #06C755;

      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(6, 199, 85, 0.3);
      margin-bottom: 12px;
    }
    .btn-secondary {
      background-color: #00B900;
    }
    .btn-unblock {
      background-color: #f39c12;
      box-shadow: 0 4px 8px rgba(243, 156, 18, 0.3);
    }
    .notice {
      font-size: 13px;

<body>

  <div class="card">
    <h3 id="storeNameDisplay">櫃位商品引導</h3>
    <h2 id="itemTitle">載入中...</h2>
    <p id="guideText">點擊下方按鈕，直接將商品資訊傳送至專屬聊天室！</p>
    
    <div id="actionArea">
      <button class="btn btn-secondary">讀取中...</button>
    </div>
  </div>

  <script>
    // 💡 【未來擴充區】：未來擴充至 30 家店，直接在這裡往下新增 store3, store4 ... store30
    const storeConfig = {
      'store1': {
        name: '亞梭傢俬-特力和樂HOLA新店店',
        botBasicId: '@blr1162r',
        botHomeUrl: 'https://line.me/R/ti/p/@blr1162r'
      },
      'store2': {
        name: '亞梭傢俬-台北大巨蛋',
        botBasicId: '@776lwjtv',
        botHomeUrl: 'https://line.me/R/ti/p/@776lwjtv'
      }
      // 'store3': { name: '...', botBasicId: '...', botHomeUrl: '...' },
      // ... 以此類推到 store30
    };

    const stableLiffId = '2012152585-LsQsJONN';

    // 嚴格參數抓取函式
    function getQueryParam(variable) {
      try {
        var href = window.location.href;
        var searchIndex = href.indexOf('?');
        if (searchIndex === -1) return null;
        var query = href.substring(searchIndex + 1);
        var vars = query.split('&');
        for (var i = 0; i < vars.length; i++) {
          var pair = vars[i].split('=');
          if (decodeURIComponent(pair[0]) === variable) {
            return decodeURIComponent(pair[1]);
          }
        }
      } catch(e) {
        console.error('參數解析錯誤:', e);
      }
      return null;
    }

    // 1. 優先從當下網址抓取參數
    let itemName = getQueryParam('name');
    let notionUrl = getQueryParam('url');
    let storeKey = getQueryParam('store');

    // 2. 如果網址參數被快取吃掉，透過正規表達式從整串網址強制撈出 store 關鍵字
    if (!storeKey) {
      var fullMatch = window.location.href.match(/store([0-9]+)/i);
      if (fullMatch) {
        storeKey = 'store' + fullMatch[1];
      }
    }

    // 🛡️ 【終極雙重防護網：處理密碼鎖重載與 Android 快取】
    // 取得當前瀏覽行程中暫存的分店代號
    let sessionStore = sessionStorage.getItem('target_storeKey');

    if (storeKey) {
      // 如果網址帶有新的分店，且跟暫存的不一樣（代表掃了新店或切換了櫃位）
      if (sessionStore && storeKey !== sessionStore) {
        sessionStorage.setItem('target_storeKey', storeKey);
        if (itemName) sessionStorage.setItem('target_itemName', itemName);
        if (notionUrl) sessionStorage.setItem('target_notionUrl', notionUrl);
        
        // 強制重新整理，徹底打碎 Android 快取，確保全新載入
        if (!window.location.href.includes('_ref=1')) {
          window.location.replace(window.location.href + (window.location.href.includes('?') ? '&' : '?') + '_ref=1');
        }
      } else {
        // 第一次進來，直接寫入暫存
        sessionStorage.setItem('target_storeKey', storeKey);
        if (itemName) sessionStorage.setItem('target_itemName', itemName);
        if (notionUrl) sessionStorage.setItem('target_notionUrl', notionUrl);
      }
    } else {
      // 遭遇 LINE 密碼解鎖 / Face ID / 指紋登入導致網址參數遺失時，從 sessionStorage 完美救回！
      storeKey = sessionStorage.getItem('target_storeKey');
    }

    // 補齊商品名稱與 Notion 連結的 Session 救回機制
    itemName = itemName || sessionStorage.getItem('target_itemName') || '精選商品';
    notionUrl = notionUrl || sessionStorage.getItem('target_notionUrl') || '';

    // 最終保險預設
    storeKey = storeKey || 'store1';
    let activeStore = storeConfig[storeKey] || storeConfig['store1'];

    // 立即將抓到的分店與商品渲染上畫面，絕不卡住
    document.getElementById('itemTitle').innerText = itemName;
    document.getElementById('storeNameDisplay').innerText = `櫃位：${activeStore.name}`;
    
    document.getElementById('actionArea').innerHTML = `
      <button class="btn" onclick="goToChat()">發送【${itemName}】至專屬聊天室</button>
      <button class="btn btn-unblock" onclick="goToAddFriend()">若無法傳送？點此解除封鎖/加好友</button>
      <div class="notice">
        💡 若點擊發送無反應，通常是因為曾封鎖此分店帳號。請點擊下方橘色按鈕解除封鎖後，即可正常發送！
      </div>
    `;

    // 背景初始化 LIFF
    window.addEventListener('load', async function() {
      try {
        if (typeof liff !== 'undefined') {
          await liff.init({ liffId: stableLiffId });
          if (!liff.isLoggedIn()) {
            liff.login();
          }
        }
      } catch (err) {
        console.error('LIFF 初始化警告:', err);
      }
    });

    function goToChat() {
      if (!activeStore || !activeStore.botBasicId) {
        alert('尚未設定該櫃位的 Bot ID');
        return;
      }
      const messageText = `【${itemName}】商品詳細頁面： ${notionUrl}`;
      const encodeText = encodeURIComponent(messageText);
      const targetUrl = `https://line.me/R/oaMessage/${activeStore.botBasicId}/?text=${encodeText}`;

      if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
        liff.openWindow({ url: targetUrl, external: false });

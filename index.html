    };

    // 使用共用且穩定的 LIFF ID 進行初始化
    const stableLiffId = '2012152585-LsQsJONN';

    function getQueryParam(variable) {
      try {
        var searchIndex = window.location.href.indexOf('?');
        if (searchIndex === -1) return null;
        var query = window.location.href.substring(searchIndex + 1);
        var vars = query.split('&');
        for (var i = 0; i < vars.length; i++) {
          var pair = vars[i].split('=');
          if (decodeURIComponent(pair[0]) === variable) {
            return decodeURIComponent(pair[1]);
          }
        }
      } catch(e) {
        console.error('參數解析錯誤:', e);
      }
      return null;
    }

    const itemName = getQueryParam('name') || '精選商品';
    const notionUrl = getQueryParam('url') || '';
    const storeKey = getQueryParam('store') || 'store1';
